<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syslog AI Monitor</title>
<!-- Shared design tokens + components (homelab-standards). Vendored, not
     fetched: the LAN guarantees nothing, including itself. -->
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/components.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font: var(--hl-text-base)/var(--hl-leading) var(--hl-font-sans);
    background: var(--hl-canvas); color: var(--hl-fg);
  }
  /* The shell header, its nav, pills and buttons all come from components.css.
     Only row two -- this appliance's own action bar -- is declared here. The
     contract allows an app-specific second row; row one is shared.

     Both rows sit inside one sticky wrapper rather than each being sticky, so
     row two doesn't need to hardcode row one's height as a `top` offset. That
     number would be wrong the moment the header wraps on a narrow screen. */
  .shell { position: sticky; top: 0; z-index: 20; }
  .shell .hl-header { position: static; padding: 12px 24px; }
  .hbar.links {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 24px; background: var(--hl-surface);
    border-bottom: 1px solid var(--hl-border);
  }
  .spacer { flex: 1; }
  .meta { color: var(--hl-fg-muted); font-size: var(--hl-text-sm); }
  main { max-width: 980px; margin: 0 auto; padding: 24px; }
  .banner {
    padding: 16px 20px; border-radius: var(--hl-radius-lg); margin-bottom: 24px;
    border: 1px solid var(--hl-border); background: var(--hl-surface);
  }
  .banner h2 { margin: 0 0 6px; font-size: 16px; }
  .banner.s-ok { border-left: 4px solid var(--hl-ok); }
  .banner.s-warning { border-left: 4px solid var(--hl-warn); }
  .banner.s-error { border-left: 4px solid var(--hl-crit); }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--hl-fg-muted); margin: 28px 0 12px; }
  .finding {
    border: 1px solid var(--hl-border); border-radius: var(--hl-radius); padding: 14px 16px;
    margin-bottom: 12px; background: var(--hl-surface);
  }
  .finding .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .finding .title { font-weight: 600; }
  .sev { padding: 1px 8px; border-radius: var(--hl-radius-sm); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .sev-info { background: var(--hl-info-wash); color: var(--hl-info); }
  .sev-warning { background: var(--hl-warn-wash); color: var(--hl-warn); }
  .sev-error { background: var(--hl-crit-wash); color: var(--hl-crit); }
  .sev-critical { background: var(--hl-crit-wash); color: var(--hl-crit-strong); }
  .cat { color: var(--hl-fg-muted); font-size: 12px; }
  .finding .detail { margin: 4px 0; }
  .finding .evidence {
    font-family: var(--hl-font-mono); font-size: 12px;
    background: var(--hl-sunken); padding: 8px 10px; border-radius: var(--hl-radius); color: var(--hl-fg-muted);
    white-space: pre-wrap; word-break: break-word; margin: 8px 0;
  }
  .finding .rec { font-size: 13px; color: var(--hl-accent); }
  .history-item {
    border: 1px solid var(--hl-border); border-radius: var(--hl-radius); margin-bottom: 8px; background: var(--hl-surface);
  }
  .history-item summary {
    padding: 12px 16px; cursor: pointer; list-style: none;
  }
  .history-item summary::-webkit-details-marker { display: none; }
  .history-item summary::marker { content: ""; }
  /* Meta (status + time) on its own row, summary stacked below — reads well
     on both desktop and narrow mobile screens. */
  .history-item .hrow {
    display: flex; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap;
  }
  .history-item .when { color: var(--hl-fg-muted); font-size: 13px; }
  .history-item .sum { color: var(--hl-fg); line-height: 1.55; }
  .history-body { padding: 0 16px 14px; }
  .empty { color: var(--hl-fg-muted); padding: 20px 0; }
  .runmsg { color: var(--hl-fg-muted); font-size: 13px; }
  /* Row one's narrow-screen wrap is components.css's job now (560px). Only
     row two and the page gutter are app concerns. */
  @media (max-width: 480px) {
    .shell .hl-header { padding: 10px 14px; }
    .hl-header-name { font-size: 16px; }
    main { padding: 16px; }
    .meta { font-size: 12px; }
    /* Refresh goes: the dashboard already polls, and the space is better spent
       on the action that costs money to run. */
    .refresh { display: none; }
    /* Row two becomes one tidy swipeable line instead of a ragged wrap. */
    .hbar.links {
      padding: 8px 14px; gap: 18px;
      flex-wrap: nowrap; overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .hbar.links::-webkit-scrollbar { display: none; }
    .hbar.links > * { flex: 0 0 auto; }
    .hbar.links .spacer { display: none; }
  }
  code { font-family: var(--hl-font-mono); }
  /* Weekly pattern section */
  .weekly-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hl-btn--sm { font-size: 12px; padding: 5px 11px; min-height: 0; }
  .subhead { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--hl-fg-muted); margin: 16px 0 8px; }
  .trend { padding: 8px 0; border-bottom: 1px solid var(--hl-border); font-size: 14px; line-height: 1.5; }
  .trend:last-child { border-bottom: none; }
  .dir { font-weight: 700; font-size: 11px; padding: 1px 7px; border-radius: var(--hl-radius-sm); margin-right: 8px; white-space: nowrap; }
  .dir-new { background: var(--hl-info-wash); color: var(--hl-info); }
  .dir-increasing { background: var(--hl-crit-wash); color: var(--hl-crit); }
  .dir-steady { background: var(--hl-sunken); color: var(--hl-fg-muted); }
  .dir-decreasing, .dir-resolved { background: var(--hl-ok-wash); color: var(--hl-ok); }
  .watchlist { margin: 6px 0 0; padding-left: 20px; }
  .watchlist li { margin: 5px 0; }
</style>
</head>
<body>
<div class="shell">
  <!-- Row one is the shared contract: name, status, nav, running commit.
       Identical on every appliance (homelab-standards style-guide.md). -->
  <header class="hl-header">
    <h1 class="hl-header-name">Syslog AI Monitor</h1>
    <span id="headStatus"></span>
    <span class="hl-header-spacer"></span>
    <nav class="hl-header-nav">
      <a class="hl-header-link" href="/api/health" target="_blank" rel="noopener">Health</a>
      <a class="hl-header-link" href="/docs" target="_blank" rel="noopener">API&nbsp;docs</a>
      <a class="hl-header-link" href="/api/history?limit=200" target="_blank" rel="noopener">History&nbsp;JSON</a>
      <a class="hl-header-link" href="/api/weekly" target="_blank" rel="noopener">Weekly&nbsp;JSON</a>
      <a class="hl-header-link" href="/api/status" target="_blank" rel="noopener">Status&nbsp;JSON</a>
    </nav>
    <span class="hl-header-meta" id="build"></span>
  </header>
  <!-- Row two is this appliance's own: its primary action and live counters. -->
  <div class="hbar links">
    <button class="hl-btn hl-btn--primary" onclick="runNow(this)">▶ Run evaluation now</button>
    <span class="runmsg" id="runmsg"></span>
    <div class="spacer"></div>
    <span class="meta hl-num" id="buffered"></span>
    <button class="hl-btn refresh" onclick="load()">Refresh</button>
  </div>
</div>

<main>
  <div id="latest"></div>

  <h3 class="weekly-head">
    Last 7 days — patterns
    <button class="hl-btn hl-btn--primary hl-btn--sm" onclick="runWeekly(this)">▶ Run weekly review</button>
    <span class="runmsg" id="weeklymsg"></span>
  </h3>
  <div id="weekly"><div class="empty">Loading…</div></div>

  <h3>History</h3>
  <div id="history"><div class="empty">Loading…</div></div>
</main>

<script>
const fmt = (ts) => ts ? new Date(ts * 1000).toLocaleString() : "—";
const esc = (s) => (s ?? "").toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function findingHTML(f) {
  const sev = (f.severity || "info").toLowerCase();
  return `<div class="finding">
    <div class="top">
      <span class="sev sev-${esc(sev)}">${esc(sev)}</span>
      <span class="title">${esc(f.title)}</span>
      <span class="cat">${esc(f.category)} · ×${esc(f.occurrences)}</span>
    </div>
    <div class="detail">${esc(f.detail)}</div>
    ${f.evidence ? `<div class="evidence">${esc(f.evidence)}</div>` : ""}
    ${f.recommendation ? `<div class="rec">→ ${esc(f.recommendation)}</div>` : ""}
  </div>`;
}

function renderLatest(latest) {
  const el = document.getElementById("latest");
  if (!latest) {
    el.innerHTML = `<div class="banner"><h2>No evaluations yet</h2>
      <div class="meta">Logs are being collected. The first hourly evaluation will appear here.</div></div>`;
    return;
  }
  const p = latest.payload || {};
  const status = (p.overall_status || "ok").toLowerCase();
  const findings = p.findings || [];
  el.innerHTML = `
    <div class="banner s-${esc(status)}">
      <h2>Latest evaluation — ${fmt(latest.ts)}</h2>
      <div>${esc(p.summary)}</div>
      <div class="meta" style="margin-top:6px">${esc(latest.log_count)} log lines analyzed · ${findings.length} finding(s)</div>
    </div>
    ${findings.length ? `<h3>Findings</h3>${findings.map(findingHTML).join("")}`
                      : `<div class="empty">No issues found in the latest period. ✅</div>`}`;
}

// The shared pill takes --ok/--warn/--crit; this app speaks ok/warning/error.
const PILL_MOD = { ok: "ok", warning: "warn", error: "crit" };
function statusPill(status) {
  const s = (status || "ok").toLowerCase();
  return `<span class="hl-pill hl-pill--${PILL_MOD[s] || "info"}">${esc(s)}</span>`;
}

// Weekly period_status (ok|watch|action) reuses the hourly status colors.
const WEEKLY_COLOR = { action: "error", watch: "warning", ok: "ok" };

function recurringHTML(r) {
  const sev = (r.severity || "info").toLowerCase();
  return `<div class="finding">
    <div class="top">
      <span class="sev sev-${esc(sev)}">${esc(sev)}</span>
      <span class="title">${esc(r.title)}</span>
      <span class="cat">${esc(r.category)} · ${esc(r.days_seen)} day(s) · ${esc(r.frequency)}</span>
    </div>
    <div class="detail">${esc(r.detail)}</div>
    ${r.recommendation ? `<div class="rec">→ ${esc(r.recommendation)}</div>` : ""}
  </div>`;
}

function trendHTML(t) {
  const d = (t.direction || "steady").toLowerCase();
  const label = {new:"NEW", increasing:"▲ UP", steady:"= STEADY",
                 decreasing:"▼ DOWN", resolved:"✓ RESOLVED"}[d] || d;
  return `<div class="trend"><span class="dir dir-${esc(d)}">${esc(label)}</span><b>${esc(t.title)}</b> — ${esc(t.detail)}</div>`;
}

function renderWeekly(w) {
  const el = document.getElementById("weekly");
  if (!w) {
    el.innerHTML = `<div class="empty">No weekly review yet. It runs once a day over the last few days of findings — or click “Run weekly review” above.</div>`;
    return;
  }
  const p = w.payload || {};
  const s = (p.period_status || "ok").toLowerCase();
  const color = WEEKLY_COLOR[s] || "ok";
  const recurring = p.recurring_issues || [];
  const trends = p.trends || [];
  const watch = p.watchlist || [];
  el.innerHTML = `
    <div class="banner s-${esc(color)}">
      <h2>${esc(w.window_days)}-day review <span class="hl-pill hl-pill--${PILL_MOD[color] || "info"}">${esc(s)}</span></h2>
      <div>${esc(p.overall_assessment)}</div>
      <div class="meta" style="margin-top:6px">${esc(w.finding_count)} hourly evaluations reviewed · ${fmt(w.period_start)} → ${fmt(w.period_end)} · reviewed ${fmt(w.ts)}</div>
    </div>
    ${recurring.length ? `<div class="subhead">Recurring issues</div>${recurring.map(recurringHTML).join("")}` : ""}
    ${trends.length ? `<div class="subhead">Trends</div>${trends.map(trendHTML).join("")}` : ""}
    ${watch.length ? `<div class="subhead">Watchlist</div><ul class="watchlist">${watch.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${(!recurring.length && !trends.length && !watch.length) ? `<div class="empty">No notable patterns this period. ✅</div>` : ""}`;
}

function renderHistory(items) {
  const el = document.getElementById("history");
  if (!items.length) { el.innerHTML = `<div class="empty">No history yet.</div>`; return; }
  el.innerHTML = items.map(it => {
    const p = it.payload || {};
    const findings = p.findings || [];
    return `<details class="history-item">
      <summary>
        <div class="hrow">
          ${statusPill(p.overall_status)}
          <span class="when">${fmt(it.ts)}</span>
        </div>
        <div class="sum">${esc(p.summary)}</div>
      </summary>
      <div class="history-body">
        ${findings.length ? findings.map(findingHTML).join("")
                          : `<div class="empty">No issues found.</div>`}
      </div>
    </details>`;
  }).join("");
}

async function load() {
  try {
    const [statusRes, histRes, weeklyRes] = await Promise.all([
      fetch("/api/status").then(r => r.json()),
      fetch("/api/history?limit=200").then(r => r.json()),
      fetch("/api/weekly").then(r => r.json()),
    ]);
    renderLatest(statusRes.latest);
    document.getElementById("buffered").textContent =
      `${statusRes.buffered_logs} logs buffered`;
    document.getElementById("headStatus").innerHTML =
      statusRes.latest ? statusPill((statusRes.latest.payload || {}).overall_status) : "";
    renderWeekly(weeklyRes);
    renderHistory(histRes.findings || []);
  } catch (e) {
    document.getElementById("latest").innerHTML =
      `<div class="banner s-error"><h2>Could not load data</h2><div class="meta">${esc(e)}</div></div>`;
  }
}

// The running build, in the shell header where every appliance carries it.
// This dashboard has never shown it: /api/version exists and nothing linked or
// rendered it, so there was no way to tell from the UI whether a Watchtower
// update had landed. Fetched once -- it cannot change without a restart.
async function loadBuild() {
  try {
    const v = await (await fetch("/api/version")).json();
    document.getElementById("build").textContent =
      [v.commit, (v.built_at || "").slice(0, 10)].filter(Boolean).join(" · ") || "dev";
  } catch (e) { /* header meta stays empty; not worth a visible error */ }
}

async function runNow(btn) {
  const msg = document.getElementById("runmsg");
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = "Running…"; msg.textContent = "Evaluating buffered logs…";
  try {
    const r = await fetch("/api/run-now", { method: "POST" }).then(x => x.json());
    msg.textContent = r.ran ? "Done — results updated below." : "Nothing to evaluate yet.";
    await load();
  } catch (e) {
    msg.textContent = "Failed: " + e;
  } finally {
    btn.disabled = false; btn.textContent = orig;
    setTimeout(() => { msg.textContent = ""; }, 6000);
  }
}

async function runWeekly(btn) {
  const msg = document.getElementById("weeklymsg");
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = "Reviewing…"; msg.textContent = "Reviewing recent findings…";
  try {
    const r = await fetch("/api/run-weekly", { method: "POST" }).then(x => x.json());
    msg.textContent = r.ran ? "Done — patterns updated below." : "No findings to review yet.";
    await load();
  } catch (e) {
    msg.textContent = "Failed: " + e;
  } finally {
    btn.disabled = false; btn.textContent = orig;
    setTimeout(() => { msg.textContent = ""; }, 6000);
  }
}

load();
loadBuild();               // once: the build can't change without a restart
setInterval(load, 60000);  // auto-refresh each minute
</script>
</body>
</html>
