[pytest]
# `pytest` (the console script, which CI runs) does NOT put the invocation
# directory on sys.path, unlike `python -m pytest` which inserts the CWD. So
# `from app import db` resolved locally and failed in CI.
#
# Set it explicitly rather than relying on pytest's implicit rootdir insertion,
# which also varies with whether tests/conftest.py exists.
pythonpath = .
testpaths = tests
